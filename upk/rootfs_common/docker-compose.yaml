# UPK 内嵌 compose(镜像 tar 由 CI docker save 进 rootfs_<arch>/images/,tag 一致;
# 打包器强校验:变量仅限 project.yaml 已声明 parameters 与 ${TZ},禁 latest/privileged/host 网络)
services:
  filecodebox:
    # CI 打包时替换为与内嵌 tar 一致的 tag(如 filescodebox/server:0.1.0-amd64)
    image: ghcr.io/filescodebox/server:0.1.0
    container_name: filescodebox-server
    environment:
      - TZ=${TZ}
      - FCB_SERVER_MODE=release
      - FCB_PRODUCTION=1
      - FCB_JWT_SECRET=${FCB_JWT_SECRET:-}
      - FCB_ADMIN_PASSWORD=${FCB_ADMIN_PASSWORD:-}
      - FCB_USER_ALLOW_REGISTRATION=false
      - FCB_REDIS_HOST=
    volumes:
      - ${DATA_PATH}:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:12345/live"]
      interval: 15s
      timeout: 3s
      start_period: 15s
      retries: 5

  frontend:
    image: ghcr.io/filescodebox/frontend:0.1.0
    container_name: filescodebox-frontend
    ports:
      - "${FCB_API_PORT}:8080"
    environment:
      - TZ=${TZ}
      - BACKEND_HOST=filecodebox
      - BACKEND_PORT=12345
      - CLIENT_MAX_BODY_SIZE=1024m
    depends_on:
      filecodebox:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/"]
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3
