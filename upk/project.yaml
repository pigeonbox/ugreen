# 绿联 UPK 应用包定义（形态以官方 ugcli 的实际输出为准，勿凭文档臆测）。
#
# ⚠️ **字段名是官方严格 yaml 解码的**（2026-11-02 用官方 ugcli v1.1.0.13 实测）：
#   · 参数文案必须写 `i18n: {语言: {name, description}}`，每个语言都要有
#     name + description；写 `desc:` ⇒ `ugcli check` 报
#     `'parameters[0].i18n' is required`，`ugcli pack` 报
#     `field desc not found in type project.ParamItem` ⇒ **打包失败**。
#   · `default_value` **不是**官方 ParamItem 字段（和 `desc:` 一样被严格解码拒绝）
#     ⇒ 参数的默认值只能由安装向导给，不能写在 project.yaml 里。
#   · docker 应用必填 `depend_docker_version` + `depend_fw_version`，缺一个
#     ⇒ `'depend_fw_version' is required` ⇒ 打包失败。
# ⚠️ `version` 是 **UPK 应用包版本**（应用中心展示的版本），与镜像 tag 无关；
#   仓内 `VERSION` 是**产品版本**，两者语义不同、取值不同，别混。
#   列车物化清单**不含本文件** ⇒ 构建期由 `scripts/build-upk.sh` 按 VERSION
#   改写成打包用的副本（改写后自检，见该脚本）。
spec_version: "2.2"
app_id: com.pigeonbox.app
version: 4.7.1
support_arch: [amd64, arm64]
# Docker 应用:自动生成对 com.ugreen.docker 套件的 MustDepend 强依赖
is_docker_app: true
depend_docker_version: "1.7.0.0000"
depend_fw_version: "1.13.0.0000"
# 应用打开端口(对外网页端口;桌面"打开"按钮指向 http://<ip>:<port>)
port: 12345
open_type: tab
tag_types: [utility]
only_admin: false
# 安装向导可配置项(注入 compose 变量;仅允许已声明 key 与内置 ${TZ})
parameters:
  - key: DATA_PATH
    type: path
    required: true
    i18n:
      zh-CN:
        name: 数据目录
        description: 数据目录(SQLite 库+上传文件+JWT 密钥,备份它=备份全部)
      en-US:
        name: Data directory
        description: Data directory (SQLite DB + uploads + JWT secret; back it up = back up everything)
  - key: PB_API_PORT
    type: number
    required: true
    i18n:
      zh-CN:
        name: 对外端口
        description: 对外端口(1024-65535)
      en-US:
        name: Public port
        description: Public port (1024-65535)
  - key: PB_ADMIN_PASSWORD
    type: password
    required: true
    i18n:
      zh-CN:
        name: 管理员密码
        description: 管理员密码(生产模式必填,装完请立即修改)
      en-US:
        name: Admin password
        description: Admin password (required in production mode; change it after install)
i18n:
  zh-CN:
    name: PigeonBox 文件快递柜
    description: 匿名口令分享文本与文件:寄件生成口令,对方凭口令取件,到期自动销毁
    author: PigeonBox
  en-US:
    name: PigeonBox
    description: Anonymous passcode sharing for text & files
    author: PigeonBox
license_agreement_link: ["https://github.com/pigeonbox/pigeonbox/blob/main/LICENSE"]
source_code_link: ["https://github.com/pigeonbox/pigeonbox"]
