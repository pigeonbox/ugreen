name: CI
# 推送/PR:compose 双模板校验 + UPK 骨架 lint + 部署包 zip 组装断言
on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: compose 模板校验(原版 + ghcr 加速版 + UPK 内嵌版)
        run: |
          docker compose -f deploy/compose.yml config -q
          docker compose -f deploy/compose.ghcr-mirror.yml config -q
          # UPK 内嵌版是参数化模板,以哑变量解析(config -q 只验语法)
          DATA_PATH=/tmp/data PB_API_PORT=12345 TZ=Asia/Shanghai \
            docker compose -f upk/rootfs_common/docker-compose.yaml config -q
      - name: 加速版仅替换镜像源域名
        run: |
          diff <(sed 's|ghcr\.io/|ghcr.nju.edu.cn/|g' deploy/compose.yml) deploy/compose.ghcr-mirror.yml
      - name: project.yaml 可解析
        run: python3 -c "import yaml,sys;yaml.safe_load(open('upk/project.yaml'))"
      # UPK 应用包规则校验（2026-10-31 新增）：官方 ugcli 打包/安装的硬约束
      # 此前**没有任何门禁** ⇒ 包漂了要等真机安装失败才发现。
      # 这道门禁当场抓出过一个真缺陷：compose 用了未在 project.yaml 声明的
      # ${PB_JWT_SECRET} ⇒ 官方打包器强校验 ⇒ **打包直接失败**。
      - name: UPK 应用包规则校验
        run: python3 scripts/check_upk_package.py
      # 校验器自身的判据必须成立（变异测试：判据失效必须红）——
      # 否则上面那道门禁只是摆设。
      - name: UPK 校验器自测（变异测试）
        run: python3 scripts/check_upk_package_test.py
      # 镜像导出脚本的「等待镜像发布」判据自测（2026-10-31 新增）。
      # 这条判据失效 ⇒ 4.6.4 那种「镜像还在推、upk job 已起跑」的竞态会静默复活
      # ⇒ UPK 产物出不来、而 Release 照发（部分交付）。
      - name: 镜像导出等待判据自测（本地假 registry 真跑脚本）
        run: python3 scripts/export_image_tar_test.py
      - name: 共享资产与 hub 模板对齐(漂移门禁)
        # 模板真相源=hub 仓 deploy/nas/。列车 bump PR 窗口:读 hub 同列车分支模板
        # (消灭「物化已新版、模板仍旧版」的合并时序窗,1.20.0 首航实测);脚本与模板
        # 一律 gh api 实时读(raw CDN ~5min 缓存=幽灵模板)。push 事件 head_ref 空→main。
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          REF=main
          # 分支名来源**两种事件都要覆盖**（2026-10-24 实录，3.3.23 列车卡死实录）：
          #   · pull_request：github.head_ref = 源分支名（PR 场景）
          #   · push       ：github.head_ref **为空**，但 github.ref = refs/heads/<分支>
          # 此前只认 head_ref ⇒ push 事件（列车分支推送时触发）恒取 main ⇒ 期望侧读
          # **上一车**的 hub 模板，而实际侧读**本车**已物化的内容 ⇒ **必假漂移**
          # ⇒ 三个 NAS 物化 PR 全红 ⇒ auto-merge 被阻断 ⇒ 整条列车卡在 draft。
          case "${{ github.head_ref }}" in train/*) REF="${{ github.head_ref }}";; esac
          if [ "$REF" = main ]; then
            case "${{ github.ref }}" in refs/heads/train/*) REF="${{ github.ref_name }}";; esac
          fi
          # 期望侧再定位一次：**按本仓 VERSION 找 hub 的同名 tag / 列车分支**。
          # 2026-10-26 实录（4.0.2 列车）：上面的 head_ref/ref_name 只在「列车分支」
          # 事件里取到 train/*；**列车 PR 合进本仓 main 之后**的 push 事件 ⇒
          # 期望侧回落到 hub 的 main —— 而 hub 的列车 PR 此刻**还没合** ⇒ 期望侧是
          # **上一车**的模板（4.0.1），实际侧已是本车（4.0.2）⇒ **必假漂移**
          # ⇒ 三个 NAS 仓在 main 上 CI 红（drift gate 报 2 处漂移）。
          # ⇒ 期望侧改为逐个探测：hub 的 tag v<VERSION>（列车已发版 ⇒ 不可变、最准）
          #   → hub 的 train/<VERSION> 分支（列车窗口内）→ main（兜底）。
          VER="$(tr -d '[:space:]' < VERSION 2>/dev/null || true)"
          if [ -n "$VER" ] && [ "$REF" = main ]; then
            for cand in "v${VER}" "train/${VER}"; do
              if gh api "repos/pigeonbox/pigeonbox/contents/deploy/nas/sync.sh?ref=${cand}" --jq .content >/dev/null 2>&1; then
                REF="$cand"; break
              fi
            done
          fi
          gh api "repos/pigeonbox/pigeonbox/contents/deploy/nas/sync.sh?ref=$REF" --jq .content | base64 -d > /tmp/nas-sync.sh
          PB_NAS_TEMPLATE_REF="$REF" bash /tmp/nas-sync.sh check --platform ugreen --dir .

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: 组装部署包 zip(CI 版本 0.0.0)
        run: ./scripts/build-zip.sh 0.0.0
      - name: 结构断言
        run: |
          unzip -l dist/pigeonbox-ugreen-0.0.0.zip | grep -q compose.yml
          unzip -l dist/pigeonbox-ugreen-0.0.0.zip | grep -q compose.ghcr-mirror.yml
          unzip -l dist/pigeonbox-ugreen-0.0.0.zip | grep -q env.example
          unzip -l dist/pigeonbox-ugreen-0.0.0.zip | grep -q 安装指引.md
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: deploy-kit
          path: dist/*.zip
          retention-days: 14
          if-no-files-found: error
