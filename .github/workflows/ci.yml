name: CI
# 推送/PR:compose 双模板校验 + UPK 骨架 lint + 部署包 zip 组装断言
on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: compose 模板校验(原版 + ghcr 加速版 + UPK 内嵌版)
        run: |
          docker compose -f deploy/compose.yml config -q
          docker compose -f deploy/compose.ghcr-mirror.yml config -q
          # UPK 内嵌版是参数化模板,以哑变量解析(config -q 只验语法)
          DATA_PATH=/tmp/data PB_API_PORT=12345 TZ=Asia/Shanghai \
            docker compose -f upk/rootfs_common/docker-compose.yaml config -q
      - name: 加速版仅替换镜像源域名
        run: |
          diff <(sed 's|ghcr\.io/|ghcr.nju.edu.cn/|g' deploy/compose.yml) deploy/compose.ghcr-mirror.yml
      - name: project.yaml 可解析
        run: python3 -c "import yaml,sys;yaml.safe_load(open('upk/project.yaml'))"
      - name: 共享资产与 hub 模板对齐(漂移门禁)
        # 模板真相源=hub 仓 deploy/nas/。列车 bump PR 窗口:读 hub 同列车分支模板
        # (消灭「物化已新版、模板仍旧版」的合并时序窗,1.20.0 首航实测);脚本与模板
        # 一律 gh api 实时读(raw CDN ~5min 缓存=幽灵模板)。push 事件 head_ref 空→main。
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          REF=main
          case "${{ github.head_ref }}" in train/*) REF="${{ github.head_ref }}";; esac
          gh api "repos/pigeonbox/pigeonbox/contents/deploy/nas/sync.sh?ref=$REF" --jq .content | base64 -d > /tmp/nas-sync.sh
          PB_NAS_TEMPLATE_REF="$REF" bash /tmp/nas-sync.sh check --platform ugreen --dir .

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: 组装部署包 zip(CI 版本 0.0.0)
        run: ./scripts/build-zip.sh 0.0.0
      - name: 结构断言
        run: |
          unzip -l dist/pigeonbox-ugreen-0.0.0.zip | grep -q compose.yml
          unzip -l dist/pigeonbox-ugreen-0.0.0.zip | grep -q compose.ghcr-mirror.yml
          unzip -l dist/pigeonbox-ugreen-0.0.0.zip | grep -q env.example
          unzip -l dist/pigeonbox-ugreen-0.0.0.zip | grep -q 安装指引.md
      - uses: actions/upload-artifact@v7
        with:
          name: deploy-kit
          path: dist/*.zip
          retention-days: 14
          if-no-files-found: error
