name: Release
# 打 v* tag → 部署包 zip 发布(绿联无免审包格式,UPK 应用中心送审为二期,见 upk/README.md):
#   1. build: 组装 zip
#   2. release: 挂本仓 Release
#   3. attach-to-hub: 回挂生态主仓 pigeonbox/pigeonbox(tag ugreen-v*,
#      与 fnos-v*/openwrt-v* 同模式);跨仓写用 UGREEN_PAT
#      断链必须响(2026-10-08 拔除 continue-on-error——静默放行只会让 hub 统一出口缺资产)
# workflow_dispatch: 传 version(现有 tag 名)对该版本手动重跑打包+双挂
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: '目标版本(现有 tag 名,如 v0.1.0)。仅重跑打包+双挂'
        required: true
        type: string

concurrency:
  # 手动 dispatch 重跑与 tag 自动触发可能并发写同一 Release(--clobber:先写者被
  # 静默覆盖,不报错)。按目标版本分组串行;cancel-in-progress:false——发布中途
  # 取消比排队更糟。键取目标版本而非 github.ref:dispatch 的 ref 是分支、
  # tag 触发的 ref 是 tag,用 ref 分组等于没分组。
  group: ${{ github.workflow }}-${{ inputs.version || github.ref_name }}
  cancel-in-progress: false

# 默认只读;真正要写本仓 Release 的作业在作业级单独开 contents: write
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.version || github.ref_name }}
      - name: 版本一致性断言(VERSION 与 tag 对齐——错 tag/错内容拒发)
        run: |
          VER=${{ inputs.version || github.ref_name }}
          if [ -f VERSION ]; then
            [ "$(cat VERSION)" = "${VER#v}" ] || { echo "::error::VERSION=$(cat VERSION) ≠ tag $VER——发版走 hub 列车 bump,勿手改 VERSION/tag 错位"; exit 1; }
          fi
      - name: 组装部署包 zip(tag v0.1.0 → 0.1.0)
        run: |
          VER="${{ inputs.version || github.ref_name }}"
          ./scripts/build-zip.sh "${VER#v}"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: deploy-kit
          path: dist/*.zip
          retention-days: 14
          if-no-files-found: error

  # ── UPK 应用包（绿联 UGOS Pro 应用中心）──────────────────────────────
  # 独立 job：镜像 tar 导出（4 个 tar 约 260MB）耗时长且体积大，
  # 不与 deploy-kit 的 zip 组装挤在同一个 job 里。
  #
  # 产物是「ugcli pack 的输入」：官方 ugcli 必须在 Linux 上跑（保证 Unix
  # 执行位），且 sideload 需设备开发者授权（ugdev.sig）⇒ 最终 .upk 的产出
  # 与上架是外部条件。本 job 把能自动化的部分做完：骨架 + 内嵌镜像 tar + 校验。
  upk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.version || github.ref_name }}
      - name: 组装 UPK 骨架 + 导出内嵌镜像 tar
        env:
          # 送审用 Docker Hub；本地/CI 自检可用 ghcr.io。
          # ⚠️ Docker Hub 镜像尚未发布时，本 job 仍可产出 ghcr 版的骨架
          #    （compose 里钉的是 docker.io ⇒ 校验器会报「镜像源」红灯）⇒
          #    故默认走 ghcr 导出、**不改** compose（compose 是送审形态）。
          UPK_REGISTRY: ghcr.io
          UPK_NAMESPACE: pigeonbox
        run: |
          VER="${{ inputs.version || github.ref_name }}"
          ./scripts/build-upk.sh "${VER#v}"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: upk-kit
          path: |
            dist/pigeonbox-ugreen-upk-*.tar.gz
            dist/pigeonbox-upk-images-*.tar.gz
            dist/SHA256SUMS-UPK
          retention-days: 14
          if-no-files-found: error

  release:
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: deploy-kit
          path: rel
      - name: 挂本仓 Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VER: ${{ github.ref_name }}
        run: |
          gh release view "${VER}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1 || \
            gh release create "${VER}" --repo "${GITHUB_REPOSITORY}" \
              --title "PigeonBox UGREEN UGOS Pro ${VER}" \
              --notes "绿联 NAS(UGOS Pro)部署包(compose 项目一键粘贴,见 Assets)。解压后按《安装指引.md》操作:Docker → 项目 → 创建 → 粘贴 compose → 部署。含 ghcr 原版与国内加速版两份编排。UPK 应用中心形态为二期(见 upk/)。"
          gh release upload "${VER}" rel/*.zip --repo "${GITHUB_REPOSITORY}" --clobber

  attach-to-hub:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: deploy-kit
          path: rel
      - name: 回挂包到生态主仓
        env:
          GH_TOKEN: ${{ secrets.PB_BOT_TOKEN }}
          TAG: ugreen-${{ inputs.version || github.ref_name }}
          VER: ${{ inputs.version || github.ref_name }}
        run: |
          NOTES=$(printf '%s\n\n---\n🗂 **组件仓库**: [pigeonbox/ugreen](https://github.com/pigeonbox/ugreen) · **完整变更日志**: [%s](https://github.com/pigeonbox/ugreen/releases/tag/%s)\n🌐 **生态总览 / Latest**: [pigeonbox/pigeonbox](https://github.com/pigeonbox/pigeonbox/releases/latest)\n' \
            "绿联 NAS(UGOS Pro)compose 一键部署包(见 Assets)。安装说明见 ugreen 仓 README。" "${VER}" "${VER}")
          gh release view "${TAG}" --repo pigeonbox/pigeonbox >/dev/null 2>&1 || \
            gh release create "${TAG}" --repo pigeonbox/pigeonbox \
              --title "PigeonBox UGREEN UGOS Pro ${VER}" \
              --latest=false \
              --notes "${NOTES}"
          gh release upload "${TAG}" rel/*.zip --repo pigeonbox/pigeonbox --clobber
          # 组件回挂恒不为 Latest(Latest 属于 hub 生态快照 v*);release 已存在时也兜底纠偏
          gh release edit "${TAG}" --repo pigeonbox/pigeonbox --latest=false || true
          echo "已回挂到 pigeonbox/pigeonbox Releases"

      - name: 回调 hub 列车编排器(唤醒 advance 核对完成度;回调丢失由 hub 15 分钟 sweep 兜底,不阻断发布)
        env:
          CB_TOKEN: ${{ secrets.PB_BOT_TOKEN }}
          TAG: ugreen-${{ inputs.version || github.ref_name }}
        run: |
          curl -fsSL -X POST \
            -H "Authorization: Bearer $CB_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/pigeonbox/pigeonbox/dispatches \
            -d "{\"event_type\":\"train-advance\",\"client_payload\":{\"component\":\"ugreen\",\"tag\":\"$TAG\"}}" \
            || echo "::warning::hub 回调失败(train-orchestrator sweep 兜底)"
