name: Release
# 打 v* tag → 部署包 zip 发布(绿联无免审包格式) + UPK 应用中心骨架包
# (ugcli pack 的输入,见 upk/README.md):
#   1. build: 组装 zip
#   2. upk: 组装 UPK 骨架 + 导出内嵌镜像 tar(须等 ghcr 镜像发布,见该 job 注释)
#   3. release: 挂本仓 Release(zip + UPK 骨架包)——**以 upk 为门禁**
#   4. attach-to-hub: 回挂生态主仓 pigeonbox/pigeonbox(tag ugreen-v*,
#      与 fnos-v*/openwrt-v* 同模式);跨仓写用 UGREEN_PAT
#      断链必须响(2026-10-08 拔除 continue-on-error——静默放行只会让 hub 统一出口缺资产)
# workflow_dispatch: 传 version(现有 tag 名)对该版本手动重跑打包+双挂
#      (可用于修复失败的发布：upk 失败 ⇒ 本次不发任何东西,重跑即可补上)
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: '目标版本(现有 tag 名,如 v0.1.0)。仅重跑打包+双挂'
        required: true
        type: string

concurrency:
  # 手动 dispatch 重跑与 tag 自动触发可能并发写同一 Release(--clobber:先写者被
  # 静默覆盖,不报错)。按目标版本分组串行;cancel-in-progress:false——发布中途
  # 取消比排队更糟。键取目标版本而非 github.ref:dispatch 的 ref 是分支、
  # tag 触发的 ref 是 tag,用 ref 分组等于没分组。
  group: ${{ github.workflow }}-${{ inputs.version || github.ref_name }}
  cancel-in-progress: false

# 默认只读;真正要写本仓 Release 的作业在作业级单独开 contents: write
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # ⚠️ **检出「触发来源」而不是「目标版本」**（2026-11-02 实测修的真缺陷）：
          #   tag 推送  ⇒ github.ref_name = 那个 tag（如 v4.7.1）⇒ 检出 tag 内容 ✅
          #   手动 dispatch ⇒ github.ref_name = 触发分支（main）⇒ 检出**当前代码** ✅
          #   旧写法 `inputs.version || github.ref_name` 在 dispatch 时检出的是
          #   **旧 tag 里的旧代码** ⇒ 「修了打包脚本后重跑旧版本补上」根本不可能
          #   （实测：重跑 v4.7.1 ⇒ `python3: can't open file scripts/check_upk_official.py`）
          #   ⇒ 与本工作流自己注释里写的「修复失败的发布…重跑即可补上」相矛盾。
          #   要打的**版本**仍由 `inputs.version || github.ref_name` 决定（见下方断言）。
          ref: ${{ github.ref_name }}
      - name: 版本一致性断言(VERSION 与 tag 对齐——错 tag/错内容拒发)
        run: |
          VER=${{ inputs.version || github.ref_name }}
          if [ -f VERSION ]; then
            [ "$(cat VERSION)" = "${VER#v}" ] || { echo "::error::VERSION=$(cat VERSION) ≠ tag $VER——发版走 hub 列车 bump,勿手改 VERSION/tag 错位"; exit 1; }
          fi
      - name: 组装部署包 zip(tag v0.1.0 → 0.1.0)
        run: |
          VER="${{ inputs.version || github.ref_name }}"
          ./scripts/build-zip.sh "${VER#v}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: deploy-kit
          path: dist/*.zip
          retention-days: 14
          if-no-files-found: error

  # ── UPK 应用包（绿联 UGOS Pro 应用中心）──────────────────────────────
  # 独立 job：镜像 tar 导出（4 个 tar 约 260MB）耗时长且体积大，
  # 不与 deploy-kit 的 zip 组装挤在同一个 job 里。
  #
  # 产物是「ugcli pack 的输入」：官方 ugcli 必须在 Linux 上跑（保证 Unix
  # 执行位），且 sideload 需设备开发者授权（ugdev.sig）⇒ 最终 .upk 的产出
  # 与上架是外部条件。本 job 把能自动化的部分做完：骨架 + 内嵌镜像 tar + 校验。
  #
  # ⚠️ **必须等镜像发布**（2026-10-31 实测的真缺陷）：
  #   内嵌镜像 tar 来自 ghcr 的 server/frontend 镜像，而那些镜像是由
  #   **另一个仓**（pigeonbox/server）的 release 流水线推的 ⇒ 两边**并发**，
  #   本仓无从用 `needs:` 排序；而多架构 push 约 20 分钟，manifest **索引**
  #   是 buildx 在 push **末尾**才写的 ⇒ tag 在整个推送期间都查不到
  #   （匿名查 manifest = **404**）。
  #   实测：4.6.4 的本 job 在 tag 推送后 1 分钟起跑 ⇒ 4 个 tar 全部
  #   「取 manifest 失败（HTTP 404）」⇒ **UPK 产物根本没出来**，
  #   而 release job 不依赖本 job ⇒ Release 照样发出去（少了 UPK 资产）
  #   ⇒ **部分交付静默发布**。
  #   ⇒ 修法：① 导出脚本按 UPK_IMAGE_WAIT_MINUTES 轮询等待（404 = 还没发布）；
  #     ② release / attach-to-hub 以本 job 为门禁 ⇒ 本 job 失败则**什么都不发**。
  upk:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # ⚠️ **检出「触发来源」而不是「目标版本」**（2026-11-02 实测修的真缺陷）：
          #   tag 推送  ⇒ github.ref_name = 那个 tag（如 v4.7.1）⇒ 检出 tag 内容 ✅
          #   手动 dispatch ⇒ github.ref_name = 触发分支（main）⇒ 检出**当前代码** ✅
          #   旧写法 `inputs.version || github.ref_name` 在 dispatch 时检出的是
          #   **旧 tag 里的旧代码** ⇒ 「修了打包脚本后重跑旧版本补上」根本不可能
          #   （实测：重跑 v4.7.1 ⇒ `python3: can't open file scripts/check_upk_official.py`）
          #   ⇒ 与本工作流自己注释里写的「修复失败的发布…重跑即可补上」相矛盾。
          #   要打的**版本**仍由 `inputs.version || github.ref_name` 决定（见下方断言）。
          ref: ${{ github.ref_name }}
      - name: 组装 UPK 骨架 + 导出内嵌镜像 tar
        env:
          # 送审用 Docker Hub；本地/CI 自检可用 ghcr.io。
          # ⚠️ Docker Hub 镜像尚未发布时，本 job 仍可产出 ghcr 版的骨架
          #    （compose 里钉的是 docker.io ⇒ 校验器会报「镜像源」红灯）⇒
          #    故默认走 ghcr 导出、**不改** compose（compose 是送审形态）。
          UPK_REGISTRY: ghcr.io
          UPK_NAMESPACE: pigeonbox
          # 镜像尚未发布时的等待预算（分钟）。要给足多架构 push 的时间。
          UPK_IMAGE_WAIT_MINUTES: "40"
        run: |
          VER="${{ inputs.version || github.ref_name }}"
          ./scripts/build-upk.sh "${VER#v}"
      # ── 官方 ugcli 打包：出**真正的 .upk**（2026-11-02 新增）────────────
      # issue #100 里「待 Linux 打包机」的前提**不成立**：
      # 官方只提供 **linux-amd64** 二进制（要保证 Unix 执行位 ⇒ 必须 Linux），
      # 而 **ubuntu-latest 就是那台 Linux x86_64 打包机**。
      # ⇒ 本 job 把「ugcli pack 的输入」（dist/upk）交给官方工具打包，
      #    产物（*.ugb/*.upk）随 Release 发布。
      # ⚠️ 打包失败 ⇒ 本 job 失败 ⇒ release/attach-to-hub 一律不发
      #    （needs: [build, upk]）⇒ **不会静默发布半成品**。
      # 官方 ugcli 二进制缓存（15MB，从官方 CDN 拉；国内 CDN 极慢，
      # 实测能让这一步挂十几分钟）⇒ 与 CI `lint` job **同一个 key**
      # ⇒ main 分支 scope 的缓存可跨 workflow 复用 ⇒ 发版不必重新下载。
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/ugcli
          key: ugcli-v1.1.0.13-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/check_upk_official.py') }}
      - name: 官方 ugcli 打包（出 .upk）
        run: python3 scripts/check_upk_official.py --package dist/upk
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: upk-kit
          path: |
            dist/pigeonbox-ugreen-upk-*.tar.gz
            dist/pigeonbox-upk-images-*.tar.gz
            dist/SHA256SUMS-UPK
            dist/upk/build_dir/*.ugb
            dist/upk/build_dir/*.upk
          retention-days: 14
          if-no-files-found: error

  release:
    needs: [build, upk]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: deploy-kit
          path: rel
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: upk-kit
          path: rel-upk
      - name: 挂本仓 Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # ⚠️ 用 `inputs.version || github.ref_name`（不是裸 ref_name）：
          #    dispatch 时 ref_name 是**分支名**而不是 tag 名 ⇒ 裸用会挂错版本。
          VER: ${{ inputs.version || github.ref_name }}
        run: |
          gh release view "${VER}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1 || \
            gh release create "${VER}" --repo "${GITHUB_REPOSITORY}" \
              --title "PigeonBox UGREEN UGOS Pro ${VER}" \
              --notes "绿联 NAS(UGOS Pro)部署包(compose 项目一键粘贴,见 Assets)。解压后按《安装指引.md》操作:Docker → 项目 → 创建 → 粘贴 compose → 部署。含 ghcr 原版与国内加速版两份编排。UPK 应用中心形态见 Assets:① **官方 ugcli 产出的 UPK 应用包**(*.ugb/*.upk,可直接送审/sideload);② 骨架包 pigeonbox-ugreen-upk-*.tar.gz(内嵌镜像 tar,ugcli pack 的输入)与 SHA256SUMS-UPK。"
          gh release upload "${VER}" rel/*.zip --repo "${GITHUB_REPOSITORY}" --clobber
          # UPK 骨架包也要落到 Release 上——只放 CI artifact(保留 14 天)等于
          # **没发布**：用户从 Release 页面拿不到它。
          # ⚠️ 用 nullglob：官方 ugcli 的产物扩展名随版本变（.ugb/.upk）⇒
          #    写死扩展名会在「该扩展名不存在」时把整个 upload 步骤搞挂。
          shopt -s nullglob
          UPK_FILES=(rel-upk/pigeonbox-ugreen-upk-*.tar.gz \
                     rel-upk/pigeonbox-upk-images-*.tar.gz \
                     rel-upk/SHA256SUMS-UPK \
                     rel-upk/*.ugb rel-upk/*.upk)
          echo "待发布资产：${UPK_FILES[*]}"
          gh release upload "${VER}" "${UPK_FILES[@]}" \
            --repo "${GITHUB_REPOSITORY}" --clobber

  attach-to-hub:
    needs: [build, upk]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: deploy-kit
          path: rel
      - name: 回挂包到生态主仓
        env:
          GH_TOKEN: ${{ secrets.PB_BOT_TOKEN }}
          TAG: ugreen-${{ inputs.version || github.ref_name }}
          VER: ${{ inputs.version || github.ref_name }}
        run: |
          NOTES=$(printf '%s\n\n---\n🗂 **组件仓库**: [pigeonbox/ugreen](https://github.com/pigeonbox/ugreen) · **完整变更日志**: [%s](https://github.com/pigeonbox/ugreen/releases/tag/%s)\n🌐 **生态总览 / Latest**: [pigeonbox/pigeonbox](https://github.com/pigeonbox/pigeonbox/releases/latest)\n' \
            "绿联 NAS(UGOS Pro)compose 一键部署包(见 Assets)。安装说明见 ugreen 仓 README。" "${VER}" "${VER}")
          gh release view "${TAG}" --repo pigeonbox/pigeonbox >/dev/null 2>&1 || \
            gh release create "${TAG}" --repo pigeonbox/pigeonbox \
              --title "PigeonBox UGREEN UGOS Pro ${VER}" \
              --latest=false \
              --notes "${NOTES}"
          gh release upload "${TAG}" rel/*.zip --repo pigeonbox/pigeonbox --clobber
          # 组件回挂恒不为 Latest(Latest 属于 hub 生态快照 v*);release 已存在时也兜底纠偏
          gh release edit "${TAG}" --repo pigeonbox/pigeonbox --latest=false || true
          echo "已回挂到 pigeonbox/pigeonbox Releases"

      - name: 回调 hub 列车编排器(唤醒 advance 核对完成度;回调丢失由 hub 15 分钟 sweep 兜底,不阻断发布)
        env:
          CB_TOKEN: ${{ secrets.PB_BOT_TOKEN }}
          TAG: ugreen-${{ inputs.version || github.ref_name }}
        run: |
          curl -fsSL -X POST \
            -H "Authorization: Bearer $CB_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/pigeonbox/pigeonbox/dispatches \
            -d "{\"event_type\":\"train-advance\",\"client_payload\":{\"component\":\"ugreen\",\"tag\":\"$TAG\"}}" \
            || echo "::warning::hub 回调失败(train-orchestrator sweep 兜底)"
